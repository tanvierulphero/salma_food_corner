name: 🚀 Build & Push to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-deploy:
    name: 🎉 Build App & Sync to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Production Files (dist)
        run: npx vite build

      - name: 📄 Copy .htaccess to dist
        run: cp public/.htaccess dist/.htaccess || true

      - name: 💾 Save Built dist Folder to Git (For cPanel Git Version Control)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/ .cpanel.yml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update production dist build for cPanel [skip ci]"
            git push
            echo "✅ Production dist/ folder updated in Git repository!"
          else
            echo "✅ dist/ folder is already up to date."
          fi

      - name: 📂 Sync files to cPanel (FTP / FTPS / SFTP Auto-Fallback)
        continue-on-error: true
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*//||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          if [ -z "$CLEAN_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "ℹ️ FTP Secrets দেওয়া নেই। তবে dist/ ফোল্ডার গিটে সেভ হয়েছে—cPanel Git Version Control থেকে সরাসরি Pull করতে পারবেন।"
            exit 0
          fi

          sudo apt-get update -y && sudo apt-get install -y lftp

          echo "🔄 Trying FTP/FTPS deploy to $CLEAN_SERVER ..."
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" $CLEAN_SERVER;
            mirror -R --verbose --only-newer ./dist/ ./
          " && echo "✅ Successfully deployed via FTP/FTPS!" && exit 0

          echo "⚠️ FTP/FTPS returned 530 or failed. Trying plain FTP (without SSL)..."
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" $CLEAN_SERVER;
            mirror -R --verbose --only-newer ./dist/ ./
          " && echo "✅ Successfully deployed via plain FTP!" && exit 0

          echo "⚠️ Plain FTP failed. Trying SFTP (Port 22)..."
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 15;
            set net:max-retries 1;
            open -u \"$FTP_USER\",\"$FTP_PASS\" sftp://$CLEAN_SERVER:22;
            mirror -R --verbose --only-newer ./dist/ ./public_html/
          " && echo "✅ Successfully deployed via SFTP!" && exit 0

          echo "----------------------------------------------------------------"
          echo "ℹ️ নোট: FTP ইউজারনেম বা পাসওয়ার্ড cPanel গ্রহণ করেনি (530 Login failed)।"
          echo "তবে চিন্তা নেই! আপনার বিল্ড করা dist/ ফোল্ডারটি রিপোজিটরিতে সেভ করে দেওয়া হয়েছে।"
          echo "আপনি cPanel -> Git Version Control থেকে সরাসরি Pull/Deploy করতে পারবেন।"
          echo "----------------------------------------------------------------"
