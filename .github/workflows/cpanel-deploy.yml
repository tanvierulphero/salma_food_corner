name: 🚀 Build & Push to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build App & Sync to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Production Files (dist)
        run: npx vite build

      - name: 📄 Copy .htaccess, api.php & database.sql to dist
        run: |
          cp public/.htaccess dist/.htaccess || true
          cp public/api.php dist/api.php || true
          cp public/database.sql dist/database.sql || true

      - name: 📂 Sync files to cPanel (FTP / FTPS / SFTP Auto-Fallback)
        continue-on-error: true
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*//||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          if [ -z "$CLEAN_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "ℹ️ FTP Secrets দেওয়া নেই। তবে dist/ ফোল্ডার রিপোজিটরিতে আগে থেকেই বিল্ড করা আছে—cPanel Git Version Control থেকে সরাসরি Pull/Deploy করতে পারবেন।"
            exit 0
          fi

          sudo apt-get update -y && sudo apt-get install -y lftp

          echo "🔄 Trying FTP/FTPS deploy to $CLEAN_SERVER ..."
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" $CLEAN_SERVER;
            mirror -R --verbose --only-newer ./dist/ ./
          " && echo "✅ Successfully deployed via FTP/FTPS!" && exit 0

          echo "⚠️ FTP/FTPS returned 530 or failed. Trying plain FTP (without SSL)..."
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" $CLEAN_SERVER;
            mirror -R --verbose --only-newer ./dist/ ./
          " && echo "✅ Successfully deployed via plain FTP!" && exit 0

          echo "⚠️ Plain FTP failed. Trying SFTP (Port 22)..."
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 15;
            set net:max-retries 1;
            open -u \"$FTP_USER\",\"$FTP_PASS\" sftp://$CLEAN_SERVER:22;
            mirror -R --verbose --only-newer ./dist/ ./public_html/
          " && echo "✅ Successfully deployed via SFTP!" && exit 0

          echo "✅ Build completed."
