name: 🚀 Build & Push to cPanel (GitHub Actions)

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Build Vite App & Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Production Files (dist)
        run: npx vite build

      - name: 📄 Copy .htaccess to dist
        run: cp public/.htaccess dist/.htaccess || true

      - name: 📂 Sync files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
