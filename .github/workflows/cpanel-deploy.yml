name: 🚀 Build & Push to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build App & Sync to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Production Files (dist)
        run: npx vite build

      - name: 📄 Copy .htaccess, api.php & database.sql to dist (never overwrite live DB/config)
        run: |
          rm -f dist/salma_server_db.json dist/db_config.php dist/salma_db_config.php
          cp public/.htaccess dist/.htaccess || true
          cp public/api.php dist/api.php || true
          cp public/database.sql dist/database.sql || true

      - name: 📂 Sync files to cPanel (FTP / FTPS / SFTP Auto-Fallback)
        continue-on-error: true
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*//||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          if [ -z "$CLEAN_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "ℹ️ FTP Secrets দেওয়া নেই। তবে dist/ ফোল্ডার রিপোজিটরিতে আগে থেকেই বিল্ড করা আছে—cPanel Git Version Control থেকে সরাসরি Pull/Deploy করতে পারবেন।"
            exit 0
          fi

          sudo apt-get update -y && sudo apt-get install -y lftp

          echo "🔄 Trying FTP/FTPS deploy to $CLEAN_SERVER ..."
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" $CLEAN_SERVER;
            get api.php -o /tmp/remote_api.php || true;
          " || true
          if [ -f /tmp/remote_api.php ]; then
            php -r '$c=file_get_contents("/tmp/remote_api.php");if(preg_match("/\\\$DB_NAME\s*=\s*[\x27\"]([^\x27\"]+)[\x27\"]/",$c,$n)&&!empty($n[1])){preg_match("/\\\$DB_HOST\s*=\s*[\x27\"]([^\x27\"]*)[\x27\"]/",$c,$h);preg_match("/\\\$DB_USER\s*=\s*[\x27\"]([^\x27\"]*)[\x27\"]/",$c,$u);preg_match("/\\\$DB_PASS\s*=\s*[\x27\"]([^\x27\"]*)[\x27\"]/",$c,$p);$cfg="<?php\n\$DB_HOST=".var_export($h[1]?:"localhost",true).";\n\$DB_NAME=".var_export($n[1],true).";\n\$DB_USER=".var_export($u[1]?:"",true).";\n\$DB_PASS=".var_export($p[1]?:"",true).";\n";file_put_contents("dist/db_config.php",$cfg);}' || true
          fi

          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" $CLEAN_SERVER;
            mirror -R --verbose --exclude-glob salma_server_db.json --exclude-glob salma_db_config.php --exclude-glob uploads/* ./dist/ ./
          " && echo "✅ Successfully deployed via FTP/FTPS!" && exit 0

          echo "⚠️ FTP/FTPS returned 530 or failed. Trying plain FTP (without SSL)..."
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" $CLEAN_SERVER;
            mirror -R --verbose --exclude-glob salma_server_db.json --exclude-glob salma_db_config.php --exclude-glob uploads/* ./dist/ ./
          " && echo "✅ Successfully deployed via plain FTP!" && exit 0

          echo "⚠️ Plain FTP failed. Trying SFTP (Port 22)..."
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 15;
            set net:max-retries 1;
            open -u \"$FTP_USER\",\"$FTP_PASS\" sftp://$CLEAN_SERVER:22;
            mirror -R --verbose --exclude-glob salma_server_db.json --exclude-glob salma_db_config.php --exclude-glob uploads/* ./dist/ ./public_html/
          " && echo "✅ Successfully deployed via SFTP!" && exit 0

          echo "✅ Build completed."
